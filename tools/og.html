<!DOCTYPE html>
<!-- مصدر صورة المشاركة assets/og-image.png (1200×630). إعادة التوليد: انظر tools/README.md -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@500;600&display=block" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(700px 420px at 85% 10%, rgba(195,232,19,.13), transparent 60%),
      radial-gradient(600px 420px at 0% 110%, rgba(228,166,247,.13), transparent 60%),
      #0f1013;
    color: #f5f2e9;
    font-family: "IBM Plex Sans Arabic", sans-serif;
    display: grid;
    grid-template-columns: 1fr 470px;
    align-items: center;
    padding: 0 70px;
    box-sizing: border-box;
  }
  .copy { text-align: right; }
  .eyebrow { display: inline-block; font-size: 26px; font-weight: 600; color: #bdc0c8; border: 2px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px 22px; }
  h1 { margin: 6px 0 0; font-family: "Baloo Bhaijaan 2"; font-weight: 800; font-size: 210px; line-height: 1.05;
       background: linear-gradient(100deg,#f9e09b 5%,#c3e813 35%,#9fe0ec 60%,#e4a6f7 80%,#e8949d); -webkit-background-clip: text; color: transparent; }
  .en { font-family: "Baloo Bhaijaan 2"; font-weight: 800; font-size: 40px; letter-spacing: 8px; background: #c3e813; color: #121317; border-radius: 12px; padding: 0 14px; vertical-align: 70px; margin-right: 16px; }
  p { margin: 4px 0 0; font-size: 36px; font-weight: 600; line-height: 1.5; }
  .chips { margin-top: 26px; display: flex; gap: 12px; }
  .chips span { font-size: 25px; font-weight: 600; padding: 6px 20px; border-radius: 999px; background: #1f2228; border: 2px solid rgba(255,255,255,.1); }
  .art { width: 470px; height: 470px; border-radius: 60px; background: radial-gradient(circle at 50% 40%, #1c1f25, #101114 70%); display: grid; place-items: center; box-shadow: 0 0 0 2px rgba(255,255,255,.07), 0 40px 90px rgba(0,0,0,.5); }
  .art img { width: 86%; }
</style>
</head>
<body>
  <div class="copy">
    <span class="eyebrow">مسابقة جماعية • فريقان • شاشة واحدة</span>
    <h1>بايو<span class="en">BIO</span></h1>
    <p>مسابقة علمية بين فريقين</p>
    <div class="chips"><span>🧬 أحياء</span><span>🔬 علوم</span><span>🏙️ الكويت</span><span>🎯 عامة</span></div>
  </div>
  <div class="art"><img src="../assets/logo-full.png" alt="" /></div>
</body>
</html>
